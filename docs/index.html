<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mix</title>
    <style>
      :root {
        color: #172033;
        background: #f3f5f8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 15px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .app-shell {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        gap: 14px;
        height: 100vh;
        height: 100dvh;
        padding: 18px;
      }

      .app-header h1 {
        margin: 0;
        font-size: 1.45rem;
        letter-spacing: -0.025em;
      }

      .app-header p {
        margin: 3px 0 0;
        color: #667085;
        font-size: 0.85rem;
      }

      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .shortcuts-button,
      .shortcut-close {
        padding: 7px 10px;
        color: #475467;
        background: #fff;
        border: 1px solid #d6dbe4;
        border-radius: 7px;
        cursor: pointer;
        font-size: 0.76rem;
        font-weight: 600;
      }

      .shortcuts-button:hover,
      .shortcut-close:hover {
        color: #4338ca;
        border-color: #a5b4fc;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1.15fr);
        gap: 14px;
        min-height: 0;
      }

      .panel {
        display: flex;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        flex-direction: column;
        background: #fff;
        border: 1px solid #dfe3ea;
        border-radius: 10px;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
      }

      .panel-header {
        flex: 0 0 auto;
        padding: 14px;
        border-bottom: 1px solid #e7eaf0;
      }

      .panel-header > div:first-child {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .panel-header h2 {
        margin: 0;
        font-size: 1rem;
      }

      .count {
        min-width: 24px;
        padding: 2px 7px;
        color: #475467;
        background: #eef1f5;
        border-radius: 999px;
        font-size: 0.75rem;
        text-align: center;
      }

      .panel-context {
        margin: 7px 0 0;
        overflow: hidden;
        color: #667085;
        font-size: 0.78rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .search-input {
        width: 100%;
        margin-top: 11px;
        padding: 8px 10px;
        color: #172033;
        background: #f8fafc;
        border: 1px solid #d6dbe4;
        border-radius: 7px;
        outline: none;
      }

      .search-input:focus {
        background: #fff;
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.13);
      }

      .track-list {
        min-height: 0;
        margin: 0;
        padding: 5px;
        overflow-y: auto;
        list-style: none;
      }

      .playlist-list {
        counter-reset: playlist;
      }

      .track-row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        margin: 1px 0;
        padding: 7px 7px 7px 10px;
        border-left: 3px solid transparent;
        border-radius: 6px;
      }

      .playlist-list .track-row {
        counter-increment: playlist;
        padding-left: 31px;
      }

      .playlist-list .track-row::before {
        content: counter(playlist) ".";
        position: absolute;
        left: 9px;
        top: 10px;
        color: #98a2b3;
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
      }

      .track-row:hover {
        background: #f7f8fb;
      }

      .track-row.is-selected {
        background: #eef2ff;
        border-left-color: #4f46e5;
      }

      .track-row.is-cursor {
        box-shadow: inset 0 0 0 1px #818cf8;
      }

      .track-main {
        display: flex;
        min-width: 0;
        flex: 1;
        flex-direction: column;
        align-items: flex-start;
        padding: 0;
        overflow: hidden;
        background: none;
        border: 0;
        cursor: pointer;
        text-align: left;
      }

      .track-main:focus-visible,
      .track-action:focus-visible,
      .panel-tab:focus-visible {
        outline: 2px solid #4f46e5;
        outline-offset: 2px;
      }

      .track-title {
        display: block;
        width: 100%;
        overflow: hidden;
        font-size: 0.85rem;
        font-weight: 600;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .track-meta {
        display: block;
        width: 100%;
        margin-top: 3px;
        overflow: hidden;
        color: #667085;
        font-size: 0.72rem;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .match-details {
        display: flex;
        gap: 5px;
        margin-top: 5px;
      }

      .match-details:empty {
        display: none;
      }

      .match-detail {
        padding: 2px 5px;
        color: #4338ca;
        background: #e0e7ff;
        border-radius: 4px;
        font-size: 0.67rem;
        font-weight: 600;
      }

      .track-action {
        flex: 0 0 auto;
        min-width: 48px;
        padding: 5px 8px;
        color: #4338ca;
        background: #fff;
        border: 1px solid #c7d2fe;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.72rem;
        font-weight: 600;
      }

      .track-action:hover {
        color: #fff;
        background: #4f46e5;
        border-color: #4f46e5;
      }

      .remove-action {
        color: #b42318;
        border-color: #f3c3bf;
      }

      .remove-action:hover {
        background: #b42318;
        border-color: #b42318;
      }

      .empty-state {
        display: grid;
        min-height: 160px;
        margin: auto;
        padding: 24px;
        place-content: center;
        color: #667085;
        text-align: center;
      }

      .empty-state p {
        max-width: 240px;
        margin: 3px 0;
        font-size: 0.8rem;
      }

      .empty-state .empty-heading {
        color: #344054;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .panel-tabs {
        display: none;
      }

      .shortcut-backdrop {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: flex;
        align-items: flex-start;
        justify-content: flex-end;
        padding: 64px 18px 18px;
        background: rgba(15, 23, 42, 0.18);
      }

      .shortcut-dialog {
        width: min(360px, 100%);
        padding: 16px;
        background: #fff;
        border: 1px solid #dfe3ea;
        border-radius: 10px;
        box-shadow: 0 16px 40px rgba(16, 24, 40, 0.2);
      }

      .shortcut-dialog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .shortcut-dialog h2 {
        margin: 0;
        font-size: 1rem;
      }

      .shortcut-list {
        display: grid;
        gap: 9px;
        margin: 16px 0 0;
        padding: 0;
        list-style: none;
      }

      .shortcut-list li {
        display: grid;
        grid-template-columns: 112px 1fr;
        align-items: center;
        gap: 12px;
        color: #475467;
        font-size: 0.8rem;
      }

      .shortcut-list kbd {
        width: fit-content;
        padding: 3px 6px;
        color: #344054;
        background: #f8fafc;
        border: 1px solid #d6dbe4;
        border-bottom-width: 2px;
        border-radius: 5px;
        font-family: inherit;
        font-size: 0.72rem;
        font-weight: 600;
      }

      @media (max-width: 800px) {
        .app-shell {
          gap: 10px;
          min-height: 100vh;
          min-height: 100dvh;
          padding: max(12px, env(safe-area-inset-top))
            max(12px, env(safe-area-inset-right))
            max(12px, env(safe-area-inset-bottom))
            max(12px, env(safe-area-inset-left));
        }

        .shortcuts-button,
        .shortcut-close,
        .panel-tab,
        .track-action {
          min-height: 44px;
        }

        .panel-tabs {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          padding: 3px;
          background: #e7eaf0;
          border-radius: 8px;
        }

        .panel-tab {
          padding: 9px 7px;
          background: transparent;
          border: 0;
          border-radius: 6px;
          cursor: pointer;
          font-size: 0.8rem;
          font-weight: 600;
        }

        .panel-tab.is-active {
          background: #fff;
          box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
        }

        .workspace {
          display: block;
          min-height: 0;
        }

        .panel {
          display: none;
          height: 100%;
        }

        .panel.is-active {
          display: flex;
        }

        .shortcut-backdrop {
          align-items: center;
          padding: max(12px, env(safe-area-inset-top))
            max(12px, env(safe-area-inset-right))
            max(12px, env(safe-area-inset-bottom))
            max(12px, env(safe-area-inset-left));
          overflow-y: auto;
        }

        .shortcut-dialog {
          max-height: 100%;
          overflow-y: auto;
        }
      }

      @media (max-width: 480px) {
        .app-shell {
          gap: 8px;
          padding-top: max(10px, env(safe-area-inset-top));
        }

        .app-header p {
          display: none;
        }

        .shortcuts-button {
          min-width: 44px;
          padding: 7px 9px;
          font-size: 0;
        }

        .shortcuts-button::before {
          content: "?";
          font-size: 1rem;
        }

        .panel-header {
          padding: 12px;
        }

        .track-list {
          padding: 4px;
        }

        .track-row {
          gap: 8px;
          padding: 8px 6px 8px 9px;
        }

        .playlist-list .track-row {
          padding-left: 29px;
        }

        .track-main {
          min-height: 44px;
          justify-content: center;
        }

        .track-title,
        .track-meta {
          white-space: normal;
        }

        .track-title {
          display: -webkit-box;
          -webkit-box-orient: vertical;
          -webkit-line-clamp: 2;
        }

        .track-meta {
          display: -webkit-box;
          -webkit-box-orient: vertical;
          -webkit-line-clamp: 2;
        }

        .match-details {
          flex-wrap: wrap;
        }

        .track-action {
          min-width: 58px;
          padding: 8px;
        }

        .shortcut-list li {
          grid-template-columns: minmax(84px, auto) 1fr;
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="main"></div>
    <script src="index.js"></script>
  </body>
</html>
